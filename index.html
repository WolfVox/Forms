<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WolfVox™ | DevForms</title>
    <link rel="icon" type="image/x-icon" href="https://github.com/WolfVox/Logos/blob/main/DevForms.png?raw=true">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg: #000000;
            --header: #000000;
            --card-bg: #0f0f10;
            --Notic-bg: rgb(0, 0, 0);
            --border: #2d2d30;
            --accent: #7a6cff;
            --text-main: #eeeeee;
            --text-dim: #a1a1aa;
            --render-green: #00d1b2;
            --error: #ff4d4d;
        }

        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; transition: all 0.15s ease; }
        
        body { 
            background-color: var(--bg); 
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 60px 60px;
            color: var(--text-main); 
            margin: 0; 
        }

        nav {
            display: flex; align-items: center; gap: 20px;
            padding: 12px 30px; background: var(--header); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        
        .search-container { flex: 1; max-width: 400px; position: relative; }
        .search-container input {
            width: 100%; background: #000; border: 1px solid var(--border);
            color: rgb(76, 76, 76); padding: 6px 12px 6px 35px; border-radius: 6px; font-size: 13px;
        }
        .search-container i { position: absolute; left: 12px; top: 9px; color: var(--text-dim); font-size: 12px; }

        .sub-nav {
            display: flex; gap: 5px; padding: 10px 30px; 
            background: var(--header); border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .sub-btn {
            background: transparent; border: none; color: var(--text-main);
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .sub-btn:hover { background: var(--border); }
        .sub-btn.active { border-bottom: 2px solid #f78166; border-radius: 0; font-weight: 600; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; min-height: 60vh; }
        .form-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; background: var(--card-bg); border: 1px solid var(--border);
            margin-bottom: -1px; cursor: pointer;
        }
        .form-row:first-child { border-radius: 6px 6px 0 0; }
        .form-row:last-child { border-radius: 0 0 6px 6px; margin-bottom: 50px; }
        .form-row:hover { background: #1c1c1f; border-color: var(--text-dim); z-index: 5; position: relative; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        .modal-content input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid var(--border); color: white; border-radius: 6px; }
        
        .overlay {
            position: fixed; top: 0; right: -100%; width: 100%; max-width: 600px;
            height: 100%; background: var(--header); border-left: 1px solid var(--border);
            z-index: 2000; padding: 60px 40px; overflow-y: auto;
        }
        .overlay.active { right: 0; box-shadow: -20px 0 50px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 24px; color: var(--text-dim); }

        .sitemap-container {
            max-width: 100%; margin-top: 20px auto;
            background: var(--Notic-bg); border-top: rgba(255, 255, 255, 0.235) solid 0.5px;
            padding: 40px; display: flex;
            justify-content: space-evenly; align-items: center;
        }
        .sitemap-col a { display: block; color: var(--accent); text-decoration: none; margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        
        footer { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; background-color: #000000 ; border-top: 1px solid var(--border); }
        .img-preview { width: 100%; border-radius: 8px; margin: 20px 0; border: 1px solid var(--border); display: block; }
        .vote-disabled { opacity: 0.3; cursor: not-allowed !important; pointer-events: none; }

        .FeedBackBtn {
            position:relative; overflow:hidden; border-radius:0px; border:1px solid rgb(255, 255, 255);
            background:rgba(0, 0, 0, 0.02); color:white; font-weight:600; letter-spacing:0.4px;
            backdrop-filter:blur(6px); transition:all .25s cubic-bezier(.4,0,.2,1);
            box-shadow:0 4px 18px rgba(0,0,0,0.25);  flex:1;  padding: 15px;
            margin: 0px;

        }
        .SiteMapImage {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 5px;
            width: 5px;
        }
        .FeedBackBtn::before {
            content:""; position:absolute; inset:0; background:#ffffff; transform:scaleX(0);
            transform-origin:right; transition:transform .35s cubic-bezier(.65,0,.35,1); z-index:-1;
        }
        .FeedBackBtn:hover::before { transform-origin:left; transform:scaleX(1); }
        .FeedBackBtn:hover { color:#000; border-color:#ffffff; }
    </style>
</head>
<body>

<nav>
    <img style=" margin:0 auto;" src="https://github.com/WolfVox/Logos/blob/main/wolfvoxtm.png?raw=true" alt="?" height="50px" width="150px" >
    <img style=" margin:0 auto;" src="https://github.com/WolfVox/Logos/blob/main/DevForms.png?raw=true" alt="?" height="50px" width="50px" >
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search or jump to..." onkeyup="if(event.key==='Enter') searchForms()">
    </div>
    <div style="flex-grow: 1;"></div>
    <div class="nav-links" id="navAuthArea" style="font-size: 14px; display: flex; gap: 15px; align-items: center;">
        <a href="javascript:void(0)" onclick="window.location.href='https://login.wolfvox.me'" style="color:white; text-decoration:none;">Sign In</a>
        <button  class="FeedBackBtn" onclick="window.location.href='https://login.wolfvox.me'">Get Started</button>
    </div>
</nav>

<div id="authModal" class="modal">
    <div class="modal-content">
        <h3>Sign In</h3>
        <div id="g_id_onload"
             data-client_id="116311894928-qararv9qqqhtjomb2nbljfbrgrho9uft.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleGoogleLogin"
             data-auto_prompt="false">
        </div>
        <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_black" data-text="continue_with" data-size="large" data-logo_alignment="left" style="display: flex; justify-content: center;"></div>
        
        <div style="margin:20px 0; font-size:12px; color:var(--text-dim);">OR EMAIL (Staff only)</div>
        <input type="email" placeholder="Email Address" disabled>
        <input type="password" placeholder="Password" disabled>
        <button onclick="closeAuth()" style="background:none; border:none; color:var(--text-dim); margin-top:10px; cursor:pointer;">Cancel</button>
    </div>
</div>

<div class="sub-nav">
    <button class="sub-btn active" onclick="location.href='index.html'"><i class="fa-solid fa-code"></i> Forms</button>
    <button class="sub-btn" onclick="location.href='Market'"><i class="fa-solid fa-shop"></i> Marketplace</button>
    <button class="sub-btn" onclick="location.href='Docs'"><i class="fa-solid fa-book"></i> Docs</button>
    <button class="sub-btn" onclick="location.href='Insights'"><i class="fa-solid fa-chart-line"></i> Insights</button>
</div>

<div class="container">
    <div id="results"></div>
</div>

<div id="detailOverlay" class="overlay">
    <div class="close-btn" onclick="closeDetail()">&times;</div>
    <div id="detailContent"></div>
</div>

<div class="sitemap-container">
    <div class="SiteMapImage"><img src="https://github.com/WolfVox/wolfvox.github.io/blob/main/WolfVoxLogo.png?raw=true" alt="?" height="125px" width="125px"></div>
    <div class="sitemap-col"><h4>Product</h4><a href="#">Forms</a><a href="#">Analytics</a></div>
    <div class="sitemap-col"><h4>Resources</h4><a href="#">Docs</a><a href="#">Hub</a></div>
    <div class="sitemap-col"><h4>Community</h4><a href="#">Discord</a><a href="#">Twitter</a></div>
    <div class="sitemap-col"><h4>Legal</h4><a href="#">Privacy</a><a href="#">Terms</a></div>
</div>

<footer>&copy; 2026 WolfVoxCo. | Community Forms.</footer>

<script>
const API = "https://backhand-forms.onrender.com/api/forms";
const ADMIN_EMAIL = "wolfvoxco@gmail.com";
let currentData = [];

/** * COOKIE HELPERS 
 */
function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
    return null;
}

function setCookie(name, value, days = 7) {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = "; expires=" + date.toUTCString();
    document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";
}

// Retrieve user from Cookie instead of LocalStorage
let user = null;
const cookieData = getCookie('wv_user');
if (cookieData) {
    try {
        user = JSON.parse(cookieData);
    } catch (e) {
        console.error("Cookie parse error", e);
    }
}

// --- Auth Utilities ---
function openAuth() { document.getElementById('authModal').style.display='flex'; }
function closeAuth() { document.getElementById('authModal').style.display='none'; }

function handleGoogleLogin(response) {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    loginUser(payload.name, payload.email, payload.picture);
}

function loginUser(name, email, img) {
    // Save to Cookie
    const userData = JSON.stringify({name, email, img});
    setCookie('wv_user', userData, 7);
    location.reload();
}

function logout() {
    // 1. Define the cookie name
    const name = 'wv_user';
    
    // 2. Clear for the root domain (covers all subdomains)
    document.cookie = name + '=; Max-Age=-99999999; path=/; domain=.wolfvox.me; SameSite=Lax';
    
    // 3. Clear for the current specific subdomain (just in case)
    document.cookie = name + '=; Max-Age=-99999999; path=/;';
    
    // 4. Clear localStorage as a fallback
    localStorage.removeItem(name);
    
    // 5. Redirect to login
    window.location.href = 'https://login.wolfvox.me';
}

function handlePublish() {
    if(!user) { openAuth(); } else { window.location.href = 'Create.html'; }
}

function updateNav() {
    const authArea = document.getElementById('navAuthArea');
    if(user && authArea) {
        authArea.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px; background:var(--card-bg); padding:5px 10px; border-radius:20px; border:1px solid var(--border);">
                <span style="font-size:12px;">${user.name}</span>
                <img src="${user.img}" width="24" height="24" style="border-radius:50%; border:1px solid var(--accent); object-fit:cover;">
            </div>
            <a href="javascript:void(0)" onclick="logout()" style="color:var(--error); text-decoration:none; font-size:11px; margin-left:10px;">Logout</a>
            <button onclick="handlePublish()" class="FeedBackBtn" >Publish</button>
        `;
    }
}

// --- Main Search Logic ---
async function searchForms() {
    const q = document.getElementById("searchInput").value.toLowerCase().trim();
    const results = document.getElementById("results");
    results.innerHTML = "<div style='padding:40px; text-align:center;'>Searching WolfVox Database...</div>";

    try {
        const res = await fetch(API);
        let data = await res.json();

        const filteredData = data.filter(item => {
            const title = item.title || item.Title || "";
            const content = item.content || item.Content || "";
            return title.toLowerCase().includes(q) || content.toLowerCase().includes(q);
        });

        filteredData.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        results.innerHTML = "";

        if (filteredData.length === 0) {
            results.innerHTML = `
                <div style="padding:60px; text-align:center; color:var(--text-dim);">
                    <i class="fa-solid fa-magnifying-glass" style="font-size:30px; margin-bottom:15px; opacity:0.3;"></i>
                    <p>No forms found matching "<b>${q}</b>"</p>
                    <button onclick="document.getElementById('searchInput').value=''; searchForms();" 
                        style="background:none; border:1px solid var(--border); color:var(--accent); padding:8px 15px; border-radius:6px; cursor:pointer;">
                        Clear Search
                    </button>
                </div>`;
            return;
        }

        filteredData.forEach((item, index) => {
            const fTitle = item.title || item.Title || "Untitled";
            const fEmail = item.authoremail || item.authorEmail || "";
            const fName = item.authorname || item.authorName || "Anonymous Wolf";
            const fImg = item.authorimg || item.authorImg || `https://ui-avatars.com/api/?name=${fName}`;
            const fDate = item.date || item.Date || "Recently";
            const fLikes = item.likes || 0;
            const isVerified = fEmail === ADMIN_EMAIL;
            
            const emailUser = fEmail ? fEmail.split('@')[0].toLowerCase() : 'anonymous';
            const cleanTitle = fTitle.toLowerCase().replace(/[^a-z0-9]/g, ''); 
            const viewerURL = `https://wolfvox.github.io/Form/?id=${emailUser}-${cleanTitle}`;

            results.innerHTML += `
            <div class="form-row">
                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <span style="color:var(--accent); font-weight:700; font-size: 16px;">${fTitle}</span>
                        <div style="display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim); margin-top:4px;">
                            <img src="${fImg}" width="18" height="18" style="border-radius:50%; border:1px solid var(--border); object-fit:cover;">
                            <span>by ${fName} ${isVerified ? '<i class="fa-solid fa-circle-check" style="color:var(--render-green); font-size:10px;"></i>' : ''}</span>
                        </div>
                    </div>
                    <div style="display:flex; gap:15px; color:var(--text-dim); font-size:13px;">
                        <span><i class="fa-solid fa-thumbs-up"></i> ${fLikes}</span>
                    </div>
                </div>

                <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;">
                    <div style="font-size:10px; color:var(--text-dim); font-family:monospace;">
                        ID: ${emailUser} • ${fDate.includes('T') ? fDate.split('T')[0] : fDate}
                    </div>
                    
                    <div style="display:flex; gap:8px;">
                        <button onclick="openDetail(${index})" 
                            style="background: var(--card-bg); color: white; border: 1px solid var(--border); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 700;">
                            READ
                        </button>
                        <button onclick="window.location.href='${viewerURL}'" 
                            style="background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: 700;">
                            FULL VIEW
                        </button>
                    </div>
                </div>
            </div>`;
        });
        currentData = filteredData;
    } catch (e) {
        results.innerHTML = "<div style='color:coral; text-align:center; padding:40px;'>Search Offline.</div>";
    }
}

// --- The Unified Detail View ---
function openDetail(index) {
    const item = currentData[index];
    const fTitle = item.title || item.Title || "Untitled";
    const fContent = item.content || item.Content || "";
    const fEmail = item.authoremail || item.authorEmail || "";
    const fName = item.authorname || item.authorName || "Anonymous Wolf";
    const fImg = item.authorimg || item.authorImg || `https://ui-avatars.com/api/?name=${fName}`;
    const fVideo = item.video || item.Video || "";
    const fImage = item.image || item.Image || "";
    const fDate = item.date || item.Date || "";
    const fLikes = item.likes || 0;

    const liked = user && (item.likedby || item.likedBy || []).includes(user.email);
    const disliked = user && (item.dislikedby || item.dislikedBy || []).includes(user.email);
    const reported = user && (item.reportedby || item.reportedBy || []).includes(user.email);
    const isVerified = fEmail === ADMIN_EMAIL;

    let mediaHTML = "";
    if (fVideo && fVideo !== "null") {
        const vidId = fVideo.includes("v=") ? fVideo.split("v=")[1].split("&")[0] : fVideo.split("/").pop();
        mediaHTML = `<div style="margin-top:15px; aspect-ratio:16/9; overflow:hidden; border-radius:8px; border:1px solid var(--border);"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}" frameborder="0" allowfullscreen></iframe></div>`;
    }

    document.getElementById("detailContent").innerHTML = `
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
            <img src="${fImg}" width="40" height="40" style="border-radius:50%; border:2px solid var(--accent); object-fit:cover; background:#000;">
            <div style="font-size:14px; font-weight:700; color:white;">
                ${fName} ${isVerified ? '<i class="fa-solid fa-circle-check" style="color:var(--render-green); margin-left:5px;"></i>' : ''}
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px;">
            <h2 style="margin:0; font-size:24px; color:var(--accent); line-height:1.2;">${fTitle}</h2>
            <div style="font-size:12px; color:var(--text-dim); font-family:monospace; padding-bottom:10px; border-bottom:1px solid var(--border);">
                @${fEmail.split('@')[0]} • Published ${fDate ? fDate.split('T')[0] : 'Recently'}
            </div>
        </div>

        <div style="background:rgba(255,255,255,0.03); border:1px solid var(--border); padding:20px; border-radius:12px;">
            <div style="line-height:1.7; white-space:pre-wrap; word-break:break-word; color:#eee;">${fContent}</div>
            ${fImage && fImage !== "null" ? `<img src="${fImage}" style="width:100%; border-radius:8px; margin-top:15px; border:1px solid var(--border);">` : ""}
            ${mediaHTML}
        </div>

        <div style="margin-top:25px; display:flex; gap:12px;">
            <button class="sub-btn ${liked ? 'vote-disabled' : ''}" 
                    style="flex:1; background:var(--card-bg); border:1px solid var(--border); padding:12px;" 
                    onclick="sendVote('${fTitle}', '${fEmail}', 'like')">
                <i class="fa-solid fa-thumbs-up"></i> ${liked ? 'Liked' : 'Like'} (${fLikes})
            </button>
            <button class="sub-btn ${disliked ? 'vote-disabled' : ''}" 
                    style="flex:1; background:var(--card-bg); border:1px solid var(--border); padding:12px;" 
                    onclick="sendVote('${fTitle}', '${fEmail}', 'dislike')">
                <i class="fa-solid fa-thumbs-down"></i> ${disliked ? 'Disliked' : 'Dislike'}
            </button>
            <button class="sub-btn ${reported ? 'vote-disabled' : ''}" 
                    style="background:var(--card-bg); border:1px solid var(--border); padding:12px; color:var(--error); width:60px;" 
                    onclick="sendVote('${fTitle}', '${fEmail}', 'report')">
                <i class="fa-solid fa-flag"></i>
            </button>
        </div>
    `;
    document.getElementById("detailOverlay").classList.add("active");
}

function closeDetail() { document.getElementById("detailOverlay").classList.remove("active"); }

async function sendVote(title, authorEmail, type) {
    if (!user) { alert("Please sign in to vote."); openAuth(); return; }
    try {
        const res = await fetch(API + "/interact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title, authorEmail, voterEmail: user.email, type })
        });
        if (res.ok) {
            await searchForms();
            const idx = currentData.findIndex(f => (f.title || f.Title) === title && (f.authoremail || f.authorEmail) === authorEmail);
            if (idx !== -1) openDetail(idx);
        }
    } catch (err) { alert("Vote failed."); }
}

// Initialize
updateNav();
searchForms();
</script>
</body>
</html>
